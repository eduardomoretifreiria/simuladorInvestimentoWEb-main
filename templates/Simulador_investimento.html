<body>
    <div class="background"></div>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <div class="container">
        <div class="header">
            <h1>📈 Simulador de Investimento</h1>
            <p>Descubra o potencial de crescimento do seu dinheiro.</p>
        </div>

        <form action="/simulador_investimento" method="post">

            <div class="input-group">
                <label for="valor_investido">Valor a investir</label>
                <input type="number" id="valor_investido" name="valor_investido" min="1" placeholder="R$ 1.000" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="tempo">Tempo</label>
                    <input type="number" id="tempo" name="tempo" min="1" placeholder="12" required>
                </div>

                <div class="input-group">
                    <label>Período</label>
                    <select name="tempo_investimento" id="tempo_investimento">
                        <option value="Meses">Meses</option>
                        <option value="Anos">Anos</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="tipo_investimento">Tipo de investimento</label>
                <select id="tipo_investimento" name="tipo_investimento" required>
                    <option value="poupança">Poupança (6% a.a.)</option>
                    <option value="cdb">CDB (10% a.a.)</option>
                    <option value="cdi">CDI (15% a.a.)</option>
                    <option value="tesouro_direto">Tesouro Direto (11% a.a.)</option>
                    <option value="acoes">Ações (25% a.a.)</option>
                </select>
            </div>

            <button type="submit">Simular Investimento</button>

        </form>

        {% if valor_final %}
        <div class="resultado">
            <h2>💰 Resultado</h2>
            <p>Valor final estimado</p>
            <span>R$ {{ valor_final }}</span>
        </div>
        
    </div>
        {% endif %}
    </div>
</body>
